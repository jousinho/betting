services:
    App\Domain\Tracking\Repository\CompetitionRepositoryInterface:
        class: App\Infrastructure\Tracking\Persistence\Doctrine\DoctrineCompetitionRepository
        autowire: true
        public: true

    App\Domain\Tracking\Repository\TeamRepositoryInterface:
        class: App\Infrastructure\Tracking\Persistence\Doctrine\DoctrineTeamRepository
        autowire: true
        public: true

    App\Domain\Tracking\Repository\LeagueMatchRepositoryInterface:
        class: App\Infrastructure\Tracking\Persistence\Doctrine\DoctrineLeagueMatchRepository
        autowire: true
        public: true

    App\Domain\Tracking\Repository\NonLeagueMatchRepositoryInterface:
        class: App\Infrastructure\Tracking\Persistence\Doctrine\DoctrineNonLeagueMatchRepository
        autowire: true
        public: true

    App\Domain\Tracking\Repository\SyncStateRepositoryInterface:
        class: App\Infrastructure\Tracking\Persistence\Doctrine\DoctrineSyncStateRepository
        autowire: true
        public: true

    App\Domain\Tracking\Repository\FootballDataProviderInterface:
        class: App\Infrastructure\Tracking\Http\Client\FootballDataClient
        arguments:
            $apiKey: 'test_key'
        autowire: true
        public: true

    App\Application\Tracking\Service\SeasonSeedService:
        autowire: true
        public: true

    App\Application\Tracking\Service\SyncService:
        autowire: true
        public: true

    App\Application\Betting\Service\BetGeneratorService:
        autowire: true
        public: true

    App\Application\Betting\Service\BetSettlementService:
        autowire: true
        public: true

    App\Domain\Betting\Repository\BetRepositoryInterface:
        class: App\Infrastructure\Betting\Persistence\Doctrine\DoctrineBetRepository
        autowire: true
        public: true

    App\Domain\Betting\Repository\SeasonStatsRepositoryInterface:
        class: App\Infrastructure\Betting\Persistence\Doctrine\DoctrineSeasonStatsRepository
        autowire: true
        public: true

    App\Application\Betting\Service\BetStatsService:
        autowire: true
        public: true

    App\Infrastructure\Tracking\Http\Controller\DashboardController:
        autowire: true
        public: true
        tags: ['controller.service_arguments']

    App\Infrastructure\Betting\Http\Controller\BettingController:
        autowire: true
        public: true
        tags: ['controller.service_arguments']
