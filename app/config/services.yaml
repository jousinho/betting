parameters:

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\Domain\:
        resource: '../src/Domain/'
        exclude:
            - '../src/Domain/**/Entity/'
            - '../src/Domain/**/Exception/'

    App\Application\:
        resource: '../src/Application/'
        exclude:
            - '../src/Application/**/DTO/'

    App\Infrastructure\:
        resource: '../src/Infrastructure/'
        exclude:
            - '../src/Infrastructure/**/Persistence/Doctrine/Migrations/'
            - '../src/Infrastructure/**/Http/Controller/'
